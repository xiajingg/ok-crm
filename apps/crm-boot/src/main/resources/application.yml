spring:
  application:
    name: ok-crm
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 3s

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  shutdown: graceful

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-underline: true
  mapper-locations: classpath*:/mapper/**/*.xml

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

okcrm:
  jwt:
    # 生产环境务必通过环境变量覆盖；至少 32 字节
    secret: ${JWT_SECRET:okcrm-dev-only-secret-key-please-override-in-production}
    expire-minutes: ${JWT_EXPIRE_MINUTES:720}
    issuer: ok-crm
  tenant:
    # 额外需要排除租户隔离的全局表（默认清单见 SharedTableIsolationStrategy）
    extra-global-tables: []
  pool:
    # 公海池自动回收任务开关；具体回收天数按租户配置（sys_tenant_config）
    recycle-enabled: ${POOL_RECYCLE_ENABLED:true}
    recycle-cron: ${POOL_RECYCLE_CRON:0 0 2 * * ?}
  # 平台超管：不属于任何租户，凭据来自配置而非数据库
  platform-admin:
    enabled: ${PLATFORM_ADMIN_ENABLED:true}
    username: ${PLATFORM_ADMIN_USERNAME:admin}
    password: ${PLATFORM_ADMIN_PASSWORD:admin123456}
    real-name: 平台管理员
  # 开通租户时自动创建的管理员账号
  tenant-provisioning:
    default-admin-username: ${TENANT_ADMIN_USERNAME:admin}
    default-admin-password: ${TENANT_ADMIN_PASSWORD:admin123456}
    default-admin-real-name: 系统管理员
