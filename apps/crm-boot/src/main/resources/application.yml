spring:
  application:
    name: ok-crm
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 3s

server:
  # 默认 9001。本机 8080 常被其它程序占用，且 9000/9001 被 rustfs 占用时
  # 可用环境变量覆盖：SERVER_PORT=9002 java -jar ...
  port: ${SERVER_PORT:9001}
  servlet:
    context-path: /api
  shutdown: graceful

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-underline: true
  mapper-locations: classpath*:/mapper/**/*.xml

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

okcrm:
  jwt:
    # 生产环境务必通过环境变量覆盖；至少 32 字节
    secret: ${JWT_SECRET:okcrm-dev-only-secret-key-please-override-in-production}
    expire-minutes: ${JWT_EXPIRE_MINUTES:720}
    issuer: ok-crm
  tenant:
    # 额外需要排除租户隔离的全局表（默认清单见 SharedTableIsolationStrategy）
    extra-global-tables: []
  pool:
    # 公海池自动回收任务开关；具体回收天数按企业配置（sys_tenant_config）
    recycle-enabled: ${POOL_RECYCLE_ENABLED:true}
    recycle-cron: ${POOL_RECYCLE_CRON:0 0 2 * * ?}

  # ---------------------------------------------------------------------------
  # 单企业私有化部署：首次启动时按这里的配置初始化企业信息（幂等，已存在则跳过）。
  # 客户拿到包之后只需要改这一段，启动即完成部署，不需要执行任何 SQL。
  # 部署完成后也可以在「企业设置」页里改（改的是数据库，不必重启）。
  # ---------------------------------------------------------------------------
  setup:
    enabled: ${SETUP_ENABLED:true}
    # 本部署对应的企业 ID。单企业部署固定一个值即可
    tenant-id: ${TENANT_ID:1}
    tenant-code: ${TENANT_CODE:default}
    # 企业名称，会显示在管理后台左上角
    tenant-name: ${TENANT_NAME:我的企业}
    region: ${TENANT_REGION:CN}
    region-name: ${TENANT_REGION_NAME:}
    timezone: ${TENANT_TIMEZONE:Asia/Shanghai}
    currency: ${TENANT_CURRENCY:CNY}
    contact-name: ${TENANT_CONTACT_NAME:}
    contact-phone: ${TENANT_CONTACT_PHONE:}
    admin:
      username: ${ADMIN_USERNAME:admin}
      # 留空则自动生成随机强密码，并打印到启动日志（推荐）
      password: ${ADMIN_PASSWORD:}
      real-name: 系统管理员
