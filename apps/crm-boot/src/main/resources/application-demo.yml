# ============================================================================
# demo profile：零依赖体验模式
#
#   java -jar ok-crm.jar --spring.profiles.active=demo
#
# 特点：
#   * 用本地嵌入式 H2 文件库（./data/okcrm.mv.db），不需要装 MySQL
#   * 数据落盘，重启不丢，适合反复演示与截图
#   * 关闭公海回收定时任务，避免演示过程中数据自己变化
#
# 适用场景：本地体验、给客户做功能演示、录屏。
# 不适用于生产 —— 生产请用 prod profile 并配置真实 MySQL 与 Redis。
# ============================================================================
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/okcrm;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
  cache:
    # 进程内缓存，不需要 Redis
    type: simple
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

okcrm:
  jwt:
    # 仅供本地体验；生产必须通过环境变量 JWT_SECRET 覆盖
    secret: demo-only-secret-key-please-do-not-use-in-production
    expire-minutes: 720
  platform-admin:
    enabled: true
    username: admin
    password: admin123456
    real-name: 平台管理员
  tenant-provisioning:
    default-admin-username: admin
    default-admin-password: admin123456
    default-admin-real-name: 系统管理员
  pool:
    # 演示时关掉定时回收，避免数据在演示过程中自动变化；
    # 需要验证回收功能时用「公海池 → 回收规则 → 立即执行一次回收」
    recycle-enabled: false

logging:
  level:
    com.okcrm: info
