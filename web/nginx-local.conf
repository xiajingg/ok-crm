server {
    listen 80;
    server_name okcrm.onekey-ai.top;

    # 指向本机 npm run build 的产物
    root /Users/xiajing/WorkBuddy AI/ok-crm/web/dist;
    index index.html;

    # ---------- 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ---------- 单页应用 ----------
    # 找不到的路径统一交给 index.html，由前端路由处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 构建产物长缓存 ----------
    # 文件名带内容 hash，内容变了文件名就变，所以可以放心 immutable
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        # 生产产物不需要每次都回源校验
        access_log off;
    }

    # ---------- index.html 不缓存 ----------
    # 保证用户下次进来能拿到最新的构建版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # ---------- 后端接口转发 ----------
    # 本机后端跑在 9002（9000/9001 被rustfs 占用）
    location /api/ {
        proxy_pass http://127.0.0.1:9002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}